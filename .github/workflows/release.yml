name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-pack-release:
    name: Build + Pack + Release (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Release ${{ matrix.architecture }}
        run: >
          dotnet build tests\Balansoft.AIAddin.Tests\Balansoft.AIAddin.Tests.csproj
          -t:Restore,Build
          -c Release
          -p:Platform=${{ matrix.architecture }}
          -p:PlatformTarget=${{ matrix.architecture }}
          -v:minimal
          --nologo

      - name: Pack ${{ matrix.architecture }}
        shell: pwsh
        run: .\scripts\Pack.ps1 -Configuration Release -Architecture ${{ matrix.architecture }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Balansoft.AIAddin.Access-*-${{ matrix.architecture }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false