name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancela runs previos del mismo PR/branch si se pushea de nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build + Test (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para git rev-parse HEAD (Pack.ps1)

      # ─────────────────────────────────────────────
      # 2. Setup .NET SDK
      # ─────────────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

# ─────────────────────────────────────────────
      # 3. Cache NuGet
      # ─────────────────────────────────────────────
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ─────────────────────────────────────────────
      # 4. Build Debug x86
      #
      # `dotnet build` y no `msbuild`: es el MSBuild del .NET SDK, que es el
      # único que resuelve Microsoft.NET.Sdk. Un MSBuild de Visual Studio
      # instalado sin el workload de .NET falla con MSB4236. La arquitectura la
      # fija Directory.Build.props (PlatformTarget=x86, Prefer32Bit), que es
      # lo que hace que el ensamblado sea x86 de verdad.
      #
      # Se compilan los .csproj, NO la solución. Motivo:
      # `msbuild Balansoft.AIAddin.slnx /p:Platform=x86` no propaga Platform a
      # los proyectos SDK-style y escribe en bin\<Config>\ en vez de
      # bin\<Arch>\<Config>\. Compilando los csproj, la ruta es siempre
      # bin\<Arch>\<Config>\net48\ y coincide con la que usan Pack.ps1 y
      # RegisterAddin.ps1.
      # ─────────────────────────────────────────────
      - name: Build (Debug ${{ matrix.architecture }})
        run: >
          dotnet build src\Balansoft.AIAddin.Access\Balansoft.AIAddin.Access.csproj
          -t:Restore,Build
          -c Debug
          -p:Platform=${{ matrix.architecture }}
          -p:PlatformTarget=${{ matrix.architecture }}
          -v:minimal
          --nologo

      - name: Build tests (Debug ${{ matrix.architecture }})
        run: >
          dotnet build tests\Balansoft.AIAddin.Tests\Balansoft.AIAddin.Tests.csproj
          -t:Restore,Build
          -c Debug
          -p:Platform=${{ matrix.architecture }}
          -p:PlatformTarget=${{ matrix.architecture }}
          -v:minimal
          --nologo

      # ─────────────────────────────────────────────
      # 5. Build Release x86
      # ─────────────────────────────────────────────
      - name: Build (Release ${{ matrix.architecture }})
        run: >
          dotnet build tests\Balansoft.AIAddin.Tests\Balansoft.AIAddin.Tests.csproj
          -t:Restore,Build
          -c Release
          -p:Platform=${{ matrix.architecture }}
          -p:PlatformTarget=${{ matrix.architecture }}
          -v:minimal
          --nologo

      # ─────────────────────────────────────────────
      # 6. Test (sin integración NIM)
      #
      # `dotnet vstest` y no `dotnet test`: `dotnet test` mete al SDK de por medio
      # (proyecto de test, trx, cobertura) y para un proyecto de net48 clasico
      # sustituye el host de test. `dotnet vstest` es el vstest.console.exe del
      # SDK hablando directo con la DLL: es exactamente lo que se ha verificado
      # en local (99/99). El switch es /Settings:, no --settings, y el logger
      # va entrecomillado porque PowerShell trata el punto y coma como
      # separador de sentencia.
      # ─────────────────────────────────────────────
      - name: Test (sin integración NIM)
        run: >
          dotnet vstest
          tests\Balansoft.AIAddin.Tests\bin\${{ matrix.architecture }}\Debug\net48\Balansoft.AIAddin.Tests.dll
          /Settings:.runsettings
          /Platform:${{ matrix.architecture }}
          '/Logger:trx;LogFileName=test-results-${{ matrix.architecture }}.trx'

      # ─────────────────────────────────────────────
      # 7. Publicar resultados de test
      #
      # El .trx lo deja vstest en TestResults\, no en la raíz.
      # ─────────────────────────────────────────────
      - name: Publicar resultados de test
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: MSTest
          path: 'TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      # ─────────────────────────────────────────────
      # 8. Verificar documentos obligatorios
      # ─────────────────────────────────────────────
      - name: Verificar documentos obligatorios
        shell: pwsh
        run: |
          $root = $PWD.Path
          $errors = @()

          $expected = @(
              "AGENTS.md",
              "MEMORY.md",
              "docs/PRD.md",
              "docs/CONSTITUTION.md",
              "docs/design/ADR-001-PROJECT-IDENTITY.md",
              "docs/design/ADR-002-PIPE-FRAMING.md",
              "docs/design/ADR-003-ABORT-MODEL.md",
              "docs/design/ADR-004-OBJECT-DETAIL.md",
              "docs/design/ADR-005-DESIGN-BY-CONTRACT.md",
              "docs/design/ADR-006-VBE-BRIDGE.md",
              "docs/design/ADR-007-NIM-CLIENT.md",
              "docs/design/ADR-008-NIM-TERMINAL.md",
              "docs/design/ADR-009-SECURE-STORE.md",
              "docs/design/ADR-010-REGISTRATION-SCRIPTS.md",
              "docs/design/ADR-011-LOGGING-VERSION.md",
              "docs/design/ADR-012-ADDIN-LIFECYCLE.md",
              "docs/design/ADR-013-SESSION-MANAGEMENT.md",
              "docs/design/ADR-014-ACCESS-AUTHORING.md",
              "docs/design/ADR-015-HUMAN-IN-THE-LOOP.md",
              "docs/design/ADR-016-AUDIT-LOGGING.md",
              "docs/design/ADR-017-IDEMPOTENCY-RESILIENCE.md",
              "docs/design/ADR-018-PRIVACY-SUPPLY-CHAIN.md",
              "specs/README.md",
              "specs/001-ADDIN-LIFECYCLE.md",
              "specs/002-VBE-BRIDGE.md",
              "specs/003-NIM-CLIENT.md",
              "specs/004-NIM-TERMINAL.md",
              "specs/005-SECURE-STORE.md",
              "specs/006-CHAT-HISTORY.md",
              "specs/007-ACCESS-READONLY.md",
              "specs/008-LOGGING-ERRORS.md",
              "specs/009-REGISTRATION.md",
              "specs/010-DESIGN-BY-CONTRACT.md",
              "specs/011-SESSION-MANAGEMENT.md",
              "specs/012-ACCESS-AUTHORING.md",
              "specs/013-SESSION-DELETE.md",
              "specs/014-I18N-UI.md",
              "specs/015-AI-DISCLOSURE.md",
              "specs/016-HUMAN-IN-THE-LOOP.md",
              "specs/017-AUDIT-LOGGING.md",
              "specs/018-IDEMPOTENCY-RESILIENCE.md",
              "specs/019-PRIVACY-SUPPLY-CHAIN-CONFIG.md",
              "Directory.Build.props",
              ".runsettings",
              "Balansoft.AIAddin.slnx",
              ".opencode/skills/bls-project-context/SKILL.md",
              ".opencode/skills/bls-com-late-binding/SKILL.md",
              ".opencode/skills/bls-vbe-automation/SKILL.md",
              ".opencode/skills/bls-nim-client-streaming/SKILL.md",
              ".opencode/skills/bls-jsonrpc-pipe-bridge/SKILL.md",
              ".opencode/skills/bls-secure-store-dpapi/SKILL.md",
              ".opencode/skills/bls-winforms-threading/SKILL.md",
              ".opencode/skills/bls-registration-scripts/SKILL.md",
              ".opencode/skills/bls-logging-errors/SKILL.md",
              ".opencode/skills/bls-testing-strategy/SKILL.md",
              ".opencode/skills/bls-workflow-nemotron/SKILL.md"
          )

          foreach ($f in $expected) {
              if (-not (Test-Path (Join-Path $root $f))) {
                  $errors += "Falta: $f"
              }
          }

          if ($errors.Count -gt 0) {
              Write-Host "::error::Faltan documentos obligatorios:"
              foreach ($e in $errors) { Write-Host "  - $e" }
              exit 1
          }
          Write-Host "OK: los $($expected.Count) documentos están presentes."

      # ─────────────────────────────────────────────
      # 8b. Gobernanza de IA (ISO/IEC 42001 / OWASP Agentic 2025)
      #
      # Sustituye la antigua checklist del agente bls-iso (retirado en F1)
      # por comprobaciones ejecutables. Falla el merge si falta política,
      # inventario, divulgación o si reaparece la malla de agentes.
      # ─────────────────────────────────────────────
      - name: Gobernanza IA - documentos, divulgacion y agente unico
        shell: pwsh
        run: |
          $root = $PWD.Path
          $errors = @()

          $gov = @(
              "docs/governance/AI-POLICY.md",
              "docs/governance/AI-RISK-REGISTER.md",
              "docs/governance/AI-BOM.md",
              "docs/governance/OWASP-AGENTIC-THREAT-MODEL.md",
              "specs/015-AI-DISCLOSURE.md"
          )
          foreach ($f in $gov) {
              if (-not (Test-Path (Join-Path $root $f))) {
                  $errors += "Falta documento de gobernanza: $f"
              }
          }

          $strings = Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsStrings.cs"
          if (-not (Select-String -Path $strings -Pattern '"AiDisclosure"' -Quiet -ErrorAction SilentlyContinue)) {
              $errors += "Falta la clave AiDisclosure en BlsStrings.cs"
          }

          $terminal = Join-Path $root "src/Balansoft.AIAddin.Access/UI/BlsNimTerminal.cs"
          if (-not (Select-String -Path $terminal -Pattern '_lblAiDisclosure' -Quiet -ErrorAction SilentlyContinue)) {
              $errors += "Falta el control de divulgacion en BlsNimTerminal.cs"
          }

          $agentsDir = Join-Path $root ".opencode/agents"
          $agentFiles = @(Get-ChildItem -Path $agentsDir -Filter "*.md" -File -ErrorAction SilentlyContinue)
          if ($agentFiles.Count -ne 1 -or $agentFiles[0].Name -ne "bls-architect.md") {
              $errors += "Modelo de agentes invalido: solo debe existir bls-architect.md"
          }

          $opencode = Get-Content (Join-Path $root ".opencode/opencode.json") -Raw | ConvertFrom-Json
          if ($opencode.agents_index.Count -ne 1) {
              $errors += "agents_index debe contener exactamente un agente"
          }

          $agentsMd = Get-Content (Join-Path $root "AGENTS.md") -Raw
          if ($agentsMd -notmatch 'AI-Assistant:\s*OpenCode Big Pickle') {
              $errors += "Falta el trailer de divulgacion AI-Assistant en AGENTS.md"
          }

          if ($errors.Count -gt 0) {
              Write-Host "::error::Gobernanza de IA incompleta:"
              foreach ($e in $errors) { Write-Host "  - $e" }
              exit 1
          }
          Write-Host "OK: gobernanza IA, divulgacion y agente unico verificados."

      # ─────────────────────────────────────────────
      # 8c. Fail-safe y supervision humana (F2 / ADR-015)
      #
      # Impide registrar una regression silenciosa del kill switch, del gate
      # HITL o del DbC en DeleteModule (riesgos R-01, R-02 y R-12).
      # ─────────────────────────────────────────────
      - name: Fail-safe y supervision humana (HITL)
        shell: pwsh
        run: |
          $root = $PWD.Path
          $errors = @()

          $required = @(
              "src/Balansoft.AIAddin.Access/Helpers/BlsSafetyGate.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsToolRiskPolicy.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsApprovalRequest.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsHumanApprovalGate.cs",
              "docs/design/ADR-015-HUMAN-IN-THE-LOOP.md",
              "specs/016-HUMAN-IN-THE-LOOP.md",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsSafetyGateTests.cs",
              "tests/Balansoft.AIAddin.Tests/Core/BlsComHelperSafetyTests.cs"
          )
          foreach ($f in $required) {
              if (-not (Test-Path (Join-Path $root $f))) {
                  $errors += "Falta artefacto de fail-safe/HITL: $f"
              }
          }

          $terminal = Join-Path $root "src/Balansoft.AIAddin.Access/UI/BlsNimTerminal.cs"
          if (Test-Path $terminal) {
              $t = Get-Content $terminal -Raw
              foreach ($token in @('_safetyGate', '_approvalGate', '_btnKillSwitch', 'MessageBoxDefaultButton.Button2', 'HITL_DENIED', 'SAFETY_TRIPPED')) {
                  if (-not $t.Contains($token)) { $errors += "BlsNimTerminal.cs no contiene $token" }
              }
          }

          $comHelper = Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsComHelper.cs"
          if (Test-Path $comHelper) {
              $c = Get-Content $comHelper -Raw
              if ($c -match 'if\s*\(\s*vbe\s*==\s*null\s*\|\|\s*!confirm\s*\)\s*return') {
                  $errors += "Regresion R-02: DeleteModule vuelve a hacer return silencioso"
              }
          }

          if ($errors.Count -gt 0) {
              Write-Host "::error::Fail-safe/HITL incompleto:"
              foreach ($e in $errors) { Write-Host "  - $e" }
              exit 1
          }
          Write-Host "OK: kill switch, HITL y DbC en DeleteModule verificados."

      # ─────────────────────────────────────────────
      # 8d. Registro de auditoría y trazabilidad (F3 / ADR-016)
      #
      # Cierra R-04 y R-05: impide que se reintroduzca un logger de texto
      # plano, que se pierda la cadena SHA-256 o que los eventos HITL dejen
      # de arrastrar correlation_id/trace_id.
      # ─────────────────────────────────────────────
      - name: Auditoria JSON, hash encadenado y correlacion (F3)
        shell: pwsh
        run: |
          $root = $PWD.Path
          $errors = @()

          $required = @(
              "src/Balansoft.AIAddin.Access/Helpers/BlsLogger.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsAuditChain.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsCorrelationContext.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsLogSanitizer.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsSloMetrics.cs",
              "docs/design/ADR-016-AUDIT-LOGGING.md",
              "specs/017-AUDIT-LOGGING.md",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsAuditLoggerTests.cs",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsAuditChainTests.cs",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsLogSanitizerTests.cs",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsCorrelationContextTests.cs",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsSloMetricsTests.cs",
              "tests/Balansoft.AIAddin.Tests/Core/Protocol/JsonRpcCorrelationTests.cs"
          )
          foreach ($f in $required) {
              if (-not (Test-Path (Join-Path $root $f))) {
                  $errors += "Falta artefacto de auditoria: $f"
              }
          }

          $logger = Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsLogger.cs"
          if (Test-Path $logger) {
              $l = Get-Content $logger -Raw
              foreach ($token in @('IBlsLogger', 'IBlsSloAware', 'BlsAuditChain', 'prev_hash', 'BlsLogSanitizer', 'BlsCorrelationContext')) {
                  if (-not $l.Contains($token)) { $errors += "BlsLogger.cs no contiene $token" }
              }
          }

          $chain = Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsAuditChain.cs"
          if (Test-Path $chain) {
              $c = Get-Content $chain -Raw
              foreach ($token in @('SHA256', 'GenesisHash', 'TryReadLastHash', 'Verify', 'FirstInvalidLine')) {
                  if (-not $c.Contains($token)) { $errors += "BlsAuditChain.cs no contiene $token" }
              }
          }

          $request = Join-Path $root "src/Balansoft.AIAddin.Access/Core/Protocol/JsonRpcRequest.cs"
          if (Test-Path $request) {
              $r = Get-Content $request -Raw
              foreach ($token in @('correlation_id', 'trace_id', 'WhenWritingNull')) {
                  if (-not $r.Contains($token)) { $errors += "JsonRpcRequest.cs no contiene $token" }
              }
          }

          $dispatcher = Join-Path $root "src/Balansoft.AIAddin.Access/Core/Protocol/JsonRpcDispatcher.cs"
          if (Test-Path $dispatcher) {
              $d = Get-Content $dispatcher -Raw
              if (-not $d.Contains('BlsCorrelationContext.Begin(request.CorrelationId, request.TraceId)')) {
                  $errors += "El dispatcher no restaura la correlacion del request"
              }
          }

          if ($errors.Count -gt 0) {
              Write-Host "::error::Auditoria F3 incompleta:"
              foreach ($e in $errors) { Write-Host "  - $e" }
              exit 1
          }
          Write-Host "OK: JSONL, cadena SHA-256, correlacion y saneamiento verificados."

      # ─────────────────────────────────────────────
      # 8e. Idempotencia y resiliencia (F4 / ADR-017)
      #
      # Cierra R-06 y R-09: impide que se pierda la clave derivada del turno,
      # que el dispatcher vuelva a ejecutar una escritura reenviada, que el
      # backoff pierda jitter o que el breaker deje de bloquear en Open.
      # ─────────────────────────────────────────────
      - name: Idempotencia y resiliencia (F4)
        shell: pwsh
        run: |
          $root = $PWD.Path
          $errors = @()

          $required = @(
              "src/Balansoft.AIAddin.Access/Core/Protocol/BlsIdempotencyKey.cs",
              "src/Balansoft.AIAddin.Access/Core/Protocol/IBlsIdempotencyCache.cs",
              "src/Balansoft.AIAddin.Access/Core/Protocol/BlsIdempotencyCache.cs",
              "src/Balansoft.AIAddin.Access/Helpers/IBlsNimRetryPolicy.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsNimRetryPolicy.cs",
              "src/Balansoft.AIAddin.Access/Helpers/IBlsCircuitBreaker.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsCircuitBreaker.cs",
              "docs/design/ADR-017-IDEMPOTENCY-RESILIENCE.md",
              "specs/018-IDEMPOTENCY-RESILIENCE.md",
              "tests/Balansoft.AIAddin.Tests/Core/Protocol/JsonRpcIdempotencyTests.cs",
              "tests/Balansoft.AIAddin.Tests/UI/Nim/BlsNimResilienceTests.cs"
          )
          foreach ($f in $required) {
              if (-not (Test-Path (Join-Path $root $f))) {
                  $errors += "Falta artefacto de idempotencia/resiliencia: $f"
              }
          }

          $key = Join-Path $root "src/Balansoft.AIAddin.Access/Core/Protocol/BlsIdempotencyKey.cs"
          if (Test-Path $key) {
              $k = Get-Content $key -Raw
              foreach ($token in @('SHA256', 'correlationId', 'method')) {
                  if (-not $k.Contains($token)) { $errors += "BlsIdempotencyKey.cs no contiene $token" }
              }
          }

          $cache = Join-Path $root "src/Balansoft.AIAddin.Access/Core/Protocol/BlsIdempotencyCache.cs"
          if (Test-Path $cache) {
              $c = Get-Content $cache -Raw
              foreach ($token in @('TryGet', 'Store', 'FromMinutes(5)', '256')) {
                  if (-not $c.Contains($token)) { $errors += "BlsIdempotencyCache.cs no contiene $token" }
              }
          }

          $dispatcher = Join-Path $root "src/Balansoft.AIAddin.Access/Core/Protocol/JsonRpcDispatcher.cs"
          if (Test-Path $dispatcher) {
              $d = Get-Content $dispatcher -Raw
              foreach ($token in @('idempotency hit', 'IdempotentReplay = true', 'BlsToolRisk.Low')) {
                  if (-not $d.Contains($token)) { $errors += "JsonRpcDispatcher.cs no contiene $token" }
              }
          }

          $client = Join-Path $root "src/Balansoft.AIAddin.Access/UI/BlsNimClient.cs"
          if (Test-Path $client) {
              $n = Get-Content $client -Raw
              foreach ($token in @('BlsNimCircuitOpenException', 'ResolveRetry', 'isProbe', 'BlsCircuitState.HalfOpen')) {
                  if (-not $n.Contains($token)) { $errors += "BlsNimClient.cs no contiene $token" }
              }
          }

          $breaker = Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsCircuitBreaker.cs"
          if (Test-Path $breaker) {
              $b = Get-Content $breaker -Raw
              foreach ($token in @('Closed', 'Open', 'HalfOpen', 'RecordFailure')) {
                  if (-not $b.Contains($token)) { $errors += "BlsCircuitBreaker.cs no contiene $token" }
              }
          }

          if ($errors.Count -gt 0) {
              Write-Host "::error::Idempotencia/resiliencia F4 incompleta:"
              foreach ($e in $errors) { Write-Host "  - $e" }
              exit 1
          }
          Write-Host "OK: idempotencia del bridge y resiliencia de NIM verificadas."

      # ─────────────────────────────────────────────
      # 8f. Privacidad, supply chain y doc sync (F5 / ADR-018)
      #
      # Cierra R-03, R-07, R-10 y R-11: impide que se pierda el scrubber
      # en la frontera HTTP, que aparezca un segundo literal de modelo,
      # que el hash del prompt del AI-BOM quede desactualizado o que la
      # entropía derivada se sustituya por la fija.
      # ─────────────────────────────────────────────
      - name: Privacidad, supply chain y doc sync (F5)
        shell: pwsh
        run: |
          $root = $PWD.Path
          $errors = @()

          $required = @(
              "src/Balansoft.AIAddin.Access/UI/Nim/BlsPiiScrubber.cs",
              "src/Balansoft.AIAddin.Access/UI/Nim/BlsPiiConsentGate.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsModelCatalog.cs",
              "src/Balansoft.AIAddin.Access/Helpers/BlsMachineEntropy.cs",
              "src/Balansoft.AIAddin.Access/Helpers/DerivedEntropyDpapiDataProtector.cs",
              "docs/design/ADR-018-PRIVACY-SUPPLY-CHAIN.md",
              "specs/019-PRIVACY-SUPPLY-CHAIN-CONFIG.md",
              "tests/Balansoft.AIAddin.Tests/UI/Nim/BlsPiiScrubberTests.cs",
              "tests/Balansoft.AIAddin.Tests/UI/Nim/BlsPiiConsentGateTests.cs",
              "tests/Balansoft.AIAddin.Tests/UI/Nim/NimPiiScrubbingTests.cs",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsModelCatalogTests.cs",
              "tests/Balansoft.AIAddin.Tests/Helpers/BlsSecureStoreEntropyTests.cs"
          )
          foreach ($f in $required) {
              if (-not (Test-Path (Join-Path $root $f))) {
                  $errors += "Falta artefacto de privacidad/supply chain: $f"
              }
          }

          # El scrubber se aplica siempre en la frontera HTTP, sin opción off.
          $builder = Get-Content (Join-Path $root "src/Balansoft.AIAddin.Access/UI/Nim/NimHttpRequestBuilder.cs") -Raw
          if (-not $builder.Contains('BlsPiiScrubber.Scrub(sanitizedMessages)')) {
              $errors += "NimHttpRequestBuilder no sanea antes de serializar"
          }

          $scrubber = Get-Content (Join-Path $root "src/Balansoft.AIAddin.Access/UI/Nim/BlsPiiScrubber.cs") -Raw
          foreach ($token in @('CONNECTION_STRING', '[EMAIL]', 'USER_PATH', 'BlsPiiFinding')) {
              if (-not $scrubber.Contains($token)) { $errors += "BlsPiiScrubber.cs no contiene $token" }
          }

          # Rechazo PII ⇒ OnCancelled + return ANTES del bucle que envía.
          $terminal = Get-Content (Join-Path $root "src/Balansoft.AIAddin.Access/UI/BlsNimTerminal.cs") -Raw
          foreach ($token in @('_piiConsentGate', 'BlsPiiScrubber.Scrub(messages)', 'BuildPiiPreview', 'OnCancelled()')) {
              if (-not $terminal.Contains($token)) { $errors += "BlsNimTerminal.cs no contiene $token" }
          }
          $idxScrub = $terminal.IndexOf('BlsPiiScrubber.Scrub(messages)')
          $idxReject = if ($idxScrub -ge 0) { $terminal.IndexOf('!_piiConsentGate.Approve(', $idxScrub) } else { -1 }
          $idxReturn = if ($idxReject -ge 0) { $terminal.IndexOf('return;', $idxReject) } else { -1 }
          $idxLoop = if ($idxScrub -ge 0) { $terminal.IndexOf('RunToolLoopAsync(messages, tools, ct)', $idxScrub) } else { -1 }
          if ($idxScrub -lt 0 -or $idxReject -lt 0 -or $idxReturn -lt 0 -or $idxLoop -lt 0 -or $idxReturn -ge $idxLoop) {
              $errors += "El rechazo de PII no aborta antes de RunToolLoopAsync (cero peticiones HTTP)"
          }

          # Entropía derivada con fallback legacy solo de lectura.
          $store = Get-Content (Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsSecureStore.cs") -Raw
          foreach ($token in @('_legacyProtector', 'migrated', 'BlsSecureStoreException')) {
              if (-not $store.Contains($token)) { $errors += "BlsSecureStore.cs no contiene $token" }
          }
          $entropy = Get-Content (Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsMachineEntropy.cs") -Raw
          foreach ($token in @('SHA256', 'Environment.MachineName', 'Environment.UserName')) {
              if (-not $entropy.Contains($token)) { $errors += "BlsMachineEntropy.cs no contiene $token" }
          }

          # Un único literal de modelo en código; el AI-BOM lo inventaría.
          $modelLiteral = 'nvidia/nemotron-3.5-lightning-30b-a3b'
          $srcFiles = Get-ChildItem -Path (Join-Path $root "src") -Recurse -Filter "*.cs" -File |
                      Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($f in $srcFiles) {
              $hits = Select-String -Path $f.FullName -Pattern $modelLiteral -SimpleMatch -ErrorAction SilentlyContinue
              foreach ($h in $hits) {
                  if ($f.Name -ne 'BlsModelCatalog.cs') {
                      $errors += "Literal de modelo duplicado en $($f.Name):$($h.LineNumber)"
                  }
              }
          }

          $bom = Get-Content (Join-Path $root "docs/governance/AI-BOM.md") -Raw
          $promptHash = (Get-FileHash -Algorithm SHA256 (Join-Path $root "src/Balansoft.AIAddin.Access/UI/SystemPromptBuilder.cs")).Hash
          $catalogHash = (Get-FileHash -Algorithm SHA256 (Join-Path $root "src/Balansoft.AIAddin.Access/Helpers/BlsModelCatalog.cs")).Hash
          if (-not $bom.Contains($promptHash)) { $errors += "AI-BOM: hash del prompt desactualizado ($promptHash)" }
          if (-not $bom.Contains($catalogHash)) { $errors += "AI-BOM: hash del catálogo desactualizado ($catalogHash)" }
          if (-not $bom.Contains($modelLiteral)) { $errors += "AI-BOM: falta el modelo exacto" }

          # Sin carga dinámica de prompts/modelos. Assembly.LoadFrom solo se
          # permite en los dos resolvers de ensamblados locales documentados.
          $allowedLoadFrom = @('AddinConnect.cs', 'BlsNimTerminal.cs')
          $forbidden = @('Assembly.LoadFrom', 'Assembly.LoadFile', 'Activator.CreateInstance', 'WebClient.DownloadString', 'WebClient.DownloadFile')
          foreach ($f in $srcFiles) {
              $text = Get-Content $f.FullName -Raw
              foreach ($p in $forbidden) {
                  if ($text.Contains($p) -and -not ($p -eq 'Assembly.LoadFrom' -and $allowedLoadFrom -contains $f.Name)) {
                      $errors += "Carga dinámica prohibida '$p' en $($f.Name)"
                  }
              }
          }

          if ($errors.Count -gt 0) {
              Write-Host "::error::Privacidad/supply chain F5 incompleta:"
              foreach ($e in $errors) { Write-Host "  - $e" }
              exit 1
          }
          Write-Host "OK: privacidad, supply chain y sincronización F5 verificadas."

      # ─────────────────────────────────────────────
      # 9. Verificar ausencia de PIAs de Office
      # ─────────────────────────────────────────────
      - name: Verificar ausencia de PIAs de Office
        shell: pwsh
        run: |
          $srcDir = Join-Path $PWD "src"
          if (-not (Test-Path $srcDir)) {
              Write-Host "ERROR: falta src/."
              exit 1
          }

          $hits = Get-ChildItem -Path $srcDir -Recurse -Filter "*.cs" -File |
                  Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
                  Select-String -Pattern "Microsoft\.Office\.Interop" -ErrorAction SilentlyContinue

          if ($hits) {
              Write-Host "::error::Se detectaron referencias a PIAs de Office:"
              $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
              exit 1
          }
          Write-Host "OK: sin PIAs de Office."

      # ─────────────────────────────────────────────
      # 10. Verificar aislamiento de dynamic
      # ─────────────────────────────────────────────
      - name: Verificar aislamiento de dynamic
        shell: pwsh
        run: |
          $srcDir = Join-Path $PWD "src"
          if (-not (Test-Path $srcDir)) {
              Write-Host "ERROR: falta src/."
              exit 1
          }

          $hits = Get-ChildItem -Path $srcDir -Recurse -Filter "*.cs" -File |
                  Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
                  Select-String -Pattern "\bdynamic\b" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Path -notlike "*\Helpers\BlsComHelper.cs" }

          if ($hits) {
              Write-Host "::error::'dynamic' fuera de Helpers/BlsComHelper.cs:"
              $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
              exit 1
          }
          Write-Host "OK: 'dynamic' aislado en Helpers/BlsComHelper.cs."

      # ─────────────────────────────────────────────
      # 11. Verificar que no hay Thread.Sleep en tests
      # ─────────────────────────────────────────────
      - name: Verificar ausencia de Thread.Sleep en tests
        shell: pwsh
        run: |
          $testsDir = Join-Path $PWD "tests"
          if (-not (Test-Path $testsDir)) {
              Write-Host "ERROR: falta tests/."
              exit 1
          }

          $hits = Get-ChildItem -Path $testsDir -Recurse -Filter "*.cs" -File |
                  Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
                  Select-String -Pattern "Thread\.Sleep" -ErrorAction SilentlyContinue

          if ($hits) {
              Write-Host "::error::Thread.Sleep en tests (prohibido por skill 09):"
              $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
              exit 1
          }
          Write-Host "OK: sin Thread.Sleep en tests."

      # ─────────────────────────────────────────────
      # 12. Verificar que todos los tests de ADR existen
      #
      # Gate de aviso, no de fallo: los specs 002/003/005/006/007 están
      # escritos pero las implementaciones reales de IBlsVbe e IBlsAccess
      # todavía no existen, así que parte de esta lista no se puede cumplir.
      # Pasa a exit 1 cuando el MVP esté completo.
      # ─────────────────────────────────────────────
      - name: Verificar tests de ADR
        shell: pwsh
        run: |
          $testsDir = Join-Path $PWD "tests"
          $testFiles = Get-ChildItem -Path $testsDir -Recurse -Filter "*.cs" -File |
                        Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          if ($testFiles.Count -eq 0) {
              Write-Host "::error::No hay tests en tests/."
              exit 1
          }

          # Nombres exactos tal y como están en specs/ y en el código.
          $required = @(
              # ADR-002 (verificados)
              "Frame_EnvioSimple_LeeMismoPayload",
              "Frame_Excede1MB_CierraConError",
              # ADR-003 (verificados)
              "SendAsync_CanceladoAntesDelPost_NoHaceRequestYEmiteCancelled",
              "SendAsync_CanceladoDuranteBackoff_NoReintenta",
              "SendAsync_SinDatos_LanzaTimeoutReportadoComoError",
              # ADR-001 (pendiente: IBlsVbe real)
              "ProjectKey_BaseGuardada_RetornaHash32Hex",
              "ProjectKey_BaseSinGuardar_RetornaHashConFlagEphemeral",
              "ProjectKey_DescriptionOverride_UsaValorDeclarado",
              # ADR-004 (pendiente: IBlsAccess real)
              "ObjectDetail_Tabla_DevuelveCamposSinSql",
              "ObjectDetail_SqlExcede8KB_TruncaYMarca",
              # ADR-015 (F2, verificados)
              "Trip_EnsureAllowed_ThrowsWithReason",
              "HighRisk_Denied_ReturnsDenied",
              "DeleteModule_WithoutConfirm_Throws",
              # ADR-016 (F3, verificados)
              "Logger_CadenaUnEvento_EsVerificable",
              "Verify_TamperMensaje_DetectaCorrupcion",
              "Dispatcher_ConCorrelacion_LosEscribeEnElLog",
              # ADR-017 (F4, verificados)
              "Idempotency_FrameDuplicado_NoEjecutaHandlerDosVeces",
              "Retry_JitterDistribuyeRetrasos",
              "Breaker_Abierto_NoHaceRequestYEmiteCircuitOpen",
              # ADR-018 (F5, verificados)
              "Scrub_Email_RedactaYSoloExponeCategoria",
              "Scrub_ConnectionString_RedactaCredencialesCompletas",
              "ConHallazgos_Rechazado_DevuelveFalse",
              "TryGet_CiphertextLegacy_MigraAProtectorV2",
              "DefaultModel_NimHttpRequestBuilder_EsAliasDelCatalogo"
          )

          $blocking = @(
              "Frame_EnvioSimple_LeeMismoPayload",
              "Frame_Excede1MB_CierraConError",
              "SendAsync_CanceladoAntesDelPost_NoHaceRequestYEmiteCancelled",
              "SendAsync_CanceladoDuranteBackoff_NoReintenta",
              "SendAsync_SinDatos_LanzaTimeoutReportadoComoError",
              "Trip_EnsureAllowed_ThrowsWithReason",
              "HighRisk_Denied_ReturnsDenied",
              "DeleteModule_WithoutConfirm_Throws",
              "Logger_CadenaUnEvento_EsVerificable",
              "Verify_TamperMensaje_DetectaCorrupcion",
              "Dispatcher_ConCorrelacion_LosEscribeEnElLog",
              "Idempotency_FrameDuplicado_NoEjecutaHandlerDosVeces",
              "Retry_JitterDistribuyeRetrasos",
              "Breaker_Abierto_NoHaceRequestYEmiteCircuitOpen",
              "Scrub_Email_RedactaYSoloExponeCategoria",
              "Scrub_ConnectionString_RedactaCredencialesCompletas",
              "ConHallazgos_Rechazado_DevuelveFalse",
              "TryGet_CiphertextLegacy_MigraAProtectorV2",
              "DefaultModel_NimHttpRequestBuilder_EsAliasDelCatalogo"
          )

          $allContent = ($testFiles | Get-Content -Raw) -join "`n"
          $missing = @()
          $missingBlocking = @()
          foreach ($name in $required) {
              if ($allContent -notmatch [regex]::Escape($name)) {
                  $missing += $name
                  if ($blocking -contains $name) { $missingBlocking += $name }
              }
          }

          if ($missing.Count -gt 0) {
              Write-Host "::warning::Tests de ADR ausentes:"
              foreach ($m in $missing) { Write-Host "  - $m" }
          }

          if ($missingBlocking.Count -gt 0) {
              Write-Host "::error::Tests de ADR implementados que han desaparecido:"
              foreach ($m in $missingBlocking) { Write-Host "  - $m" }
              exit 1
          }
          Write-Host "OK: los tests de ADR implementados están presentes."

      # ─────────────────────────────────────────────
      # 13. Verificar referencias cruzadas en MDs
      # ─────────────────────────────────────────────
      - name: Verificar referencias cruzadas en MDs
        shell: pwsh
        run: |
          $root = $PWD.Path
          $patterns = @(
              @{ Regex = 'docs/design/(ADR-\d{3}-[A-Za-z0-9\-]+\.md)';   Dir = 'docs/design' }
              @{ Regex = 'specs/(\d{3}-[A-Za-z0-9\-]+\.md)';             Dir = 'specs' }
              @{ Regex = '\.opencode/skills/(bls-[a-z0-9\-]+/SKILL\.md)'; Dir = '.opencode/skills' }
              # F5 / R-10: las rutas de código citadas en specs/ y docs/ también
              # son contratos: si el fichero se mueve, el gate debe fallar.
              @{ Regex = '`((?:src|tests|docs|specs|\.opencode)/[A-Za-z0-9_./\\-]+\.(?:cs|md|ps1|json|props|slnx|runsettings|example))`'; Dir = '' }
          )

          $mdFiles = @()
          $mdFiles += Get-ChildItem -Path (Join-Path $root "docs") -Recurse -Filter "*.md" -File -ErrorAction SilentlyContinue
          $mdFiles += Get-ChildItem -Path (Join-Path $root ".opencode/skills") -Recurse -Filter "*.md" -File -ErrorAction SilentlyContinue
          $mdFiles += Get-ChildItem -Path (Join-Path $root "specs") -Filter "*.md" -File -ErrorAction SilentlyContinue
          $mdFiles += Get-Item (Join-Path $root "AGENTS.md") -ErrorAction SilentlyContinue
          $mdFiles += Get-Item (Join-Path $root "MEMORY.md") -ErrorAction SilentlyContinue

          $broken = @()
          foreach ($md in $mdFiles) {
              $content = Get-Content $md.FullName -Raw -Encoding UTF8
              foreach ($p in $patterns) {
                  $matches = [regex]::Matches($content, $p.Regex)
                  foreach ($m in $matches) {
                      $refName = ($m.Groups[1].Value -replace '\\','/')
                      # Rutas ilustrativas, no contratos: abreviaturas con
                      # elipsis, plantillas YYYYMMDD y el placeholder Class1.cs
                      # del scaffold (documentado como residuo en CONSTITUTION).
                      if ($refName -match '\.\.\.' -or $refName -match 'YYYYMMDD' -or $refName -like '*Class1.cs') {
                          continue
                      }
                      $refPath = if ($p.Dir) { Join-Path $root "$($p.Dir)/$refName" } else { Join-Path $root $refName }
                      if (-not (Test-Path $refPath)) {
                          $broken += "$($md.Name) -> $refName"
                      }
                  }
              }
          }

          # Todo spec NNN-*.md debe aparecer en el índice (R-10).
          $specIndex = Get-Content (Join-Path $root "specs/README.md") -Raw -Encoding UTF8
          $specFiles = Get-ChildItem -Path (Join-Path $root "specs") -Filter "[0-9][0-9][0-9]-*.md" -File
          foreach ($s in $specFiles) {
              if ($specIndex -notmatch [regex]::Escape($s.Name)) {
                  $broken += "specs/README.md no indexa $($s.Name)"
              }
          }

          if ($broken.Count -gt 0) {
              Write-Host "::error::Referencias cruzadas rotas en MDs:"
              foreach ($b in $broken) { Write-Host "  - $b" }
              exit 1
          }
          Write-Host "OK: sin referencias cruzadas rotas."

      # ─────────────────────────────────────────────
      # 14. Pack + Artifact (solo en push a main)
      # ─────────────────────────────────────────────
      - name: Pack (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: .\scripts\Pack.ps1 -Configuration Release -Architecture ${{ matrix.architecture }}

      - name: Subir ZIP como artefacto (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Balansoft.AIAddin.Access-${{ matrix.architecture }}
          path: Balansoft.AIAddin.Access-*-${{ matrix.architecture }}.zip
          if-no-files-found: warn
          retention-days: 30